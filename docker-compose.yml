version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dns-rpz-net

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - dns-rpz-net

  backend:
    image: python:3.11-slim
    restart: always
    ports:
      - "8100:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - BIND_RPZ_PATH=/var/cache/bind/rpz.zone.db
      - RPZ_ZONE_NAME=rpz
    volumes:
      - backend_data:/app/data
    networks:
      - dns-rpz-net
    command: >
      sh -c "cd /app && pip install -q fastapi uvicorn sqlalchemy asyncpg python-jose[cryptography] passlib[bcrypt] pydantic-settings python-multipart openpyxl pandas httpx && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-alpine
    restart: always
    ports:
      - "3100:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - dns-rpz-net

  bind9:
    image: ubuntu/bind9:latest
    restart: always
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
      - "9535:953"
    volumes:
      - bind_cache:/var/cache/bind
      - bind_log:/var/log/bind
    networks:
      - dns-rpz-net
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    ports:
      - "5700:5678"
    depends_on:
      - postgres
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5700/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dns-rpz-net

networks:
  dns-rpz-net:
    driver: overlay

volumes:
  postgres_data:
  bind_cache:
  bind_log:
  n8n_data:
  redis_data:
  backend_data:
