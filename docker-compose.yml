version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dns-rpz-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./bind/rpz:/var/cache/bind/rpz:ro
      - backend_data:/app/data
    networks:
      - dns-rpz-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dns-rpz-frontend
    restart: unless-stopped
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - dns-rpz-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: dns-rpz-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dns-rpz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dns-rpz-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - dns-rpz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bind9:
    image: ubuntu/bind9:latest
    container_name: dns-rpz-bind9
    restart: unless-stopped
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
      - "9535:953"
    volumes:
      - ./bind/config/named.conf.rpz:/etc/bind/named.conf.local:ro
      - ./bind/rpz:/var/cache/bind/rpz
      - bind_cache:/var/cache/bind
      - bind_log:/var/log/bind
    networks:
      - dns-rpz-net
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "rndc", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: >
      sh -c "
        mkdir -p /var/log/bind &&
        chmod 755 /var/log/bind &&
        named -g -c /etc/bind/named.conf.local -u bind
      "

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: dns-rpz-n8n
    restart: unless-stopped
    ports:
      - "5700:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5700/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dns-rpz-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  dns-rpz-net:
    driver: bridge
    name: dns-rpz-net

volumes:
  postgres_data:
    name: dns-rpz-postgres_data
  bind_cache:
    name: dns-rpz-bind_cache
  bind_log:
    name: dns-rpz-bind_log
  n8n_data:
    name: dns-rpz-n8n_data
  redis_data:
    name: dns-rpz-redis_data
  backend_data:
    name: dns-rpz-backend_data
